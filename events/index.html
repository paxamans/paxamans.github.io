<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Photos from events that I hosted and/or played at.">
    <title>Iggys website | Events</title>
    <link rel="stylesheet" href="https://paxamans.github.io/style.css">
</head>

<body>
    <header class="space">
        <a href="https://paxamans.github.io/">&LeftArrow; Home</a>
    </header>

    <main>
        <h1>Events</h1>
        <p class="space">Photos from events that I hosted and/or played at.</p>
        <div class="photo-grid">
            <img src="/events/photos/event_1.jpg" alt="Event 1 poster">
        </div>
    </main>

    <div class="dark-mode-buttons">
        <button class="dark-mode-button" id="dark-mode-on"><img src="https://paxamans.github.io/dark_mode.svg"
                width="24" height="24" alt="Dark mode" aria-label="dark mode toggle" title="Dark mode"></button>
        <button class="dark-mode-button" id="dark-mode-off"><img src="https://paxamans.github.io/light_mode.svg"
                width="24" height="24" alt="Light mode" aria-label="light mode toggle" title="Light mode"></button>
    </div>
    <script>
        const cls = document.querySelector("html").classList;
        const sessionTheme = sessionStorage.getItem("theme");

        function setDark() {
            cls.add("dark-mode");
            cls.remove("light-mode");
            sessionStorage.setItem("theme", "dark");
        }
        function setLight() {
            cls.add("light-mode");
            cls.remove("dark-mode");
            sessionStorage.setItem("theme", "light");
        }

        if (sessionTheme === "dark") {
            setDark();
        } else if (sessionTheme === "light") {
            setLight();
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            setDark();
        }

        document.getElementById("dark-mode-on").addEventListener("click", setDark);
        document.getElementById("dark-mode-off").addEventListener("click", setLight);
    </script>
    <script src="/photo-gallery.js" defer></script>
</body>

</html>
